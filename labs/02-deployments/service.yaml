# A ready-made Service so you can watch the rollout from your machine.
# You build this yourself, step by step, in Lab 3.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080   # http://localhost:30080
