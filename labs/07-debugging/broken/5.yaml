apiVersion: v1
kind: Namespace
metadata:
  name: debug-5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: debug-5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/amirilovic/k8s-training-app:v1
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: debug-5
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
