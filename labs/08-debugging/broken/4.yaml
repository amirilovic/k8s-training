apiVersion: v1
kind: Namespace
metadata:
  name: debug-4
---
apiVersion: v1
kind: Secret
metadata:
  name: web-secrets
  namespace: debug-4
stringData:
  api-key: training-api-key-1234
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: debug-4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/amirilovic/k8s-training-app:v1
          ports:
            - containerPort: 8080
          env:
            - name: Secrets__ApiKey
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: ApiKey
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: debug-4
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
