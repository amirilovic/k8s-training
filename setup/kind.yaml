# One control plane and two workers, so pods spread over nodes and a node can be drained.
# NodePorts 30080 and 30081 are published on the same port numbers on your machine:
#   30080 -> http://localhost:30080   (Lab 3, your own NodePort Service)
#   30081 -> http://*.localhost:30081 (Traefik ingress controller, Lab 4 onward)
# Port 8080 stays free for kubectl port-forward.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: training
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
      - containerPort: 30081
        hostPort: 30081
  - role: worker
  - role: worker
