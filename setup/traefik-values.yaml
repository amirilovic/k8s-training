# Values for the Traefik Helm chart. Participants never use this file directly:
# render-traefik.sh turns the chart into traefik.yaml,
# which they apply with kubectl.
#
# Traefik becomes the cluster's ingress controller. Its HTTP port is NodePort 30081,
# which kind.yaml publishes on your machine, so every Ingress is reachable at
# http://<host>.localhost:30081 in the browser.
service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30081
  websecure:
    expose:
      default: false
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
# The labs only use plain Ingress objects,
# so Traefik's own IngressRoute CRDs are not needed.
providers:
  kubernetesCRD:
    enabled: false
