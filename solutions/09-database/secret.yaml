apiVersion: v1
kind: Secret
metadata:
  name: web-secrets
type: Opaque
stringData:
  Secrets__ApiKey: training-api-key-1234
  # Becomes the file /secrets/ConnectionStrings__Default, read by the app as ConnectionStrings:Default.
  # The app reads it at startup, so restart the Deployment after adding it.
  ConnectionStrings__Default: Host=postgres;Database=training;Username=training;Password=training-password
