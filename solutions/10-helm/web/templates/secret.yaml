apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  Secrets__ApiKey: {{ .Values.apiKey | quote }}
  {{- if .Values.postgres.enabled }}
  ConnectionStrings__Default: "Host={{ .Release.Name }}-postgres;Database=training;Username=training;Password={{ .Values.postgres.password }}"
  {{- end }}
